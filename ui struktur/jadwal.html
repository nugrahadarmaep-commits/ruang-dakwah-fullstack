<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal - Ruang Dakwah</title>

    <!-- Link CSS Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <!-- Link Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- Link menuju css -->
    <link rel="stylesheet" href="/dist/css/style.css">
</head>
<body class="bg-light pb-5">

    <!-- sector direktori jadwal start -->
    <header class="container pt-4 pb-3 bg-white shadow-sm sticky-top">
        <div class="d-flex justify-content-between align-items-center">
            <h4 class="fw-bold mb-0">Direktori Jadwal</h4>
            <div class="d-flex gap-3">
                <i class="bi bi-search fs-5"></i>
                <i class="bi bi-funnel fs-5"></i>
            </div>
        </div>
        <div class="mt-3">
            <div class="input-group bg-light rounded-3 overflow-hidden" style="border: none;">
                <span class="input-group-text bg-light border-0"><i class="bi bi-search text-muted"></i></span>
                <input type="text" class="form-control bg-light border-0 ps-0" placeholder="Cari Kajian (Tema, Ustaz, Masjid)..." style="font-size: 14px;">
            </div>
        </div>
        <div class="d-flex gap-2 mt-3 overflow-x-auto pb-2" style="white-space: nowrap; scrollbar-width: none;">
            <button class="btn btn-teal rounded-pill px-3 py-1 btn-sm active" style="background-color: #008080; color: white;">Semua</button>
            <button class="btn btn-outline-secondary rounded-pill px-3 py-1 btn-sm">Lokasi</button>
            <button class="btn btn-outline-secondary rounded-pill px-3 py-1 btn-sm">Akidah</button>
            <button class="btn btn-outline-secondary rounded-pill px-3 py-1 btn-sm">Fiqih</button>
            <button class="btn btn-outline-secondary rounded-pill px-3 py-1 btn-sm">Lokasi Terdekat</button>
        </div>
    </header>
    <!-- sector direktori jadwal end -->


    <!-- daftar isi dari jadwal -->
   <main id="jadwalContainer" class="mt-3">
        <div class="d-flex flex-column gap-3">
            <p class="text-center text-muted">Sabar bos memuat load jadwal dari server...</p>
        </div>
    </main>

    <!-- navbar start -->
    <nav class="navbar navbar-light bg-white border-top fixed-bottom py-2">
        <div class="container d-flex justify-content-around">
            <a href="beranda.html" class="nav-link text-center text-muted">
                <i class="bi bi-house-door fs-4"></i>
                <small class="d-block" style="font-size: 10px;">Beranda</small>
            </a>
            <a href="jadwal.html" class="nav-link text-center active text-teal">
                <i class="bi bi-calendar-event-fill fs-4" style="color: #008080;"></i>
                <small class="d-block" style="font-size: 10px;">Jadwal</small>
            </a>
            <a href="tanya_jawab.html" class="nav-link text-center text-muted">
                <i class="bi bi-chat-dots fs-4"></i>
                <small class="d-block" style="font-size: 10px;">Tanya Jawab</small>
            </a>
            <a href="profil.html" class="nav-link text-center text-muted">
                <i class="bi bi-person fs-4"></i>
                <small class="d-block" style="font-size: 10px;">Profil</small>
            </a>
        </div>
    </nav>
    <!-- navbar end -->

    <!-- pop up konfirmasi daftar start -->
    <div class="modal fade" id="modalDaftar" tabindex="-1" aria-labelledby="modalDaftarLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered px-3">
            <div class="modal-content rounded-4 border-0 shadow-lg">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold text-dark" id="modalDaftarLabel">Konfirmasi Pendaftaran</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-muted small">
                    Apakah kamu yakin ingin mendaftar kajian <strong>"Memahami Fikih Muamalah Kontemporer"</strong> di Masjid Raya Sidoarjo?
                </div>
                <div class="modal-footer border-0 pt-0 d-flex flex-nowrap">
                    <button type="button" class="btn btn-outline-secondary w-50 py-2 btn-luxury" data-bs-dismiss="modal" style="border-radius: 12px;">Batal</button>
                    <button type="button" class="btn btn-teal w-50 py-2 btn-luxury" id="btnYakinDaftar" style="background-color: #008080; color: white; border-radius: 12px;">Yakin</button>
                </div>
            </div>
        </div>
    </div>
    <!-- pop up konfirmasi daftar end -->

    <!-- pop up toast sukses start -->
    <div class="toast-container position-fixed top-0 start-50 translate-middle-x p-3" style="z-index: 1055; margin-top: 10px; width: 100%; max-width: 400px;">
        <div id="toastSukses" class="toast align-items-center text-bg-success border-0 shadow-lg" role="alert" aria-live="assertive" aria-atomic="true" style="background-color: #008080 !important; border-radius: 12px;">
            <div class="d-flex">
                <div class="toast-body fw-semibold small text-white">
                    <i class="bi bi-check-circle-fill me-2"></i> Pendaftaran berhasil! Cek tiket di Profil.
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>
    <!-- pop up toast sukses end -->

    <!-- link menuju js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/dist/js/auth.js"></script>
    <script src="/dist/js/ui.js"></script>
    <script src="/dist/js/jadwal.js"></script>
    
</body>
</html>
