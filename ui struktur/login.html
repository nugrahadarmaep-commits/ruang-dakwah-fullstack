<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Ruang Dakwah</title>

    <!-- link menuju bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- link menuju css -->
    <link rel="stylesheet" href="/dist/css/style.css">
</head>

<body class="bg-light">
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card p-4 shadow-sm border-0 card-custom" style="max-width: 400px; width: 100%; border-radius: 20px;">
            
            <div class="text-center mb-4">
                <div class="mb-2">
                    <img src="assets/img/logo.png" alt="Logo Ruang Dakwah" style="width: 80px;">
                </div>
                <h2 class="fw-bold text-dark">Ruang Dakwah</h2>
                <p class="text-muted small">Silakan masuk untuk melanjutkan</p>
            </div>

            <form id="loginForm">
                <div class="mb-3">
                    <label for="logEmail" class="form-label small fw-semibold">Email</label>
                    <input type="email" class="form-control form-control-lg fs-6" id="logEmail" placeholder="Masukkan email" required>
                </div>
                
                <div class="mb-3">
                    <label for="logPassword" class="form-label small fw-semibold">Password</label>
                    <div class="input-group">
                        <input type="password" class="form-control form-control-lg fs-6" id="logPassword" placeholder="••••••••" required>
                    </div>
                    <div class="text-end mt-1">
                        <a href="#" class="text-decoration-none small text-teal">Lupa kata sandi?</a>
                    </div>
                </div>

                <button type="submit" class="btn btn-teal btn-lg w-100 fw-bold btn-luxury mt-3" style="background-color: #008080; color: white; border-radius: 12px;">
                    Masuk
                </button>
            </form>

            <div class="text-center mt-4">
                <p class="small text-muted">Belum punya akun? <a href="register.html" class="text-teal fw-bold text-decoration-none btn-link-custom">Daftar</a></p>
            </div>
        </div>
    </div>

    <!-- link menuju js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/dist/js/auth.js"></script>
</body>
</html>
