<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil - Ruang Dakwah</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/dist/css/style.css">
</head>
<body class="bg-light pb-5">
    <!-- Profile Section -->
    <section class="container pt-5 pb-4 text-center bg-white shadow-sm mb-3" style="border-radius: 0 0 10px 10px;">
        <div class="position-relative d-inline-block mb-3">
            <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Darma" alt="Profile Picture" class="rounded-circle border border-4 border-white shadow-sm" style="width: 100px; height: 100px; object-fit: cover;">
            <div class="position-absolute bottom-0 end-0 bg-teal rounded-circle p-1 shadow-sm" style="background-color: #008080; border: 2px solid white;">
                <i class="bi bi-camera-fill text-white small"></i>
            </div>
        </div>
        
        <h4 class="fw-bold mb-0" id="namaTampil">Memuat...</h4>
        <p class="text-muted small">Anggota Terdaftar</p>
        
        <button class="btn btn-outline-teal btn-sm px-4 rounded-pill mt-2 btn-luxury" data-bs-toggle="modal" data-bs-target="#modalEditProfil" style="border-radius: 10px; border-color: #008080; color: #008080;">Edit Profil</button>
    </section>

    <!-- Main Content -->
    <main class="container">
        <h6 class="fw-bold text-muted mb-3 ps-2">AKTIVITAS SAYA</h6>
        <div class="card border-0 shadow-sm rounded-4 mb-4 overflow-hidden">
            <div class="list-group list-group-flush">
                <a href="tiket.html" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center py-3 border-0">
                    <div class="d-flex align-items-center gap-3">
                        <i class="bi bi-journal-check text-teal fs-5" style="color: #008080;"></i>
                        <span>Pendaftaran Kajian Saya</span>
                    </div>
                    <i class="bi bi-chevron-right text-muted small"></i>
                </a>
                <a href="history.html" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center py-3 border-0 border-top">
                    <div class="d-flex align-items-center gap-3">
                        <i class="bi bi-question-circle text-teal fs-5" style="color: #008080;"></i>
                        <span>Histori Pertanyaan Saya</span>
                    </div>
                    <i class="bi bi-chevron-right text-muted small"></i>
                </a>
                <a href="sematkan.html" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center py-3 border-0 border-top">
                    <div class="d-flex align-items-center gap-3">
                        <i class="bi bi-bookmark-heart text-teal fs-5" style="color: #008080;"></i>
                        <span>Materi Disimpan</span>
                    </div>
                    <i class="bi bi-chevron-right text-muted small"></i>
                </a>
            </div>
        </div>
        <h6 class="fw-bold text-muted mb-3 ps-2">PENGATURAN</h6>
        <div class="card border-0 shadow-sm rounded-4 mb-5 overflow-hidden">
            <div class="list-group list-group-flush">
                <a href="#" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center py-3 border-0">
                    <div class="d-flex align-items-center gap-3">
                        <i class="bi bi-bell text-teal fs-5" style="color: #008080;"></i>
                        <span>Notifikasi</span>
                    </div>
                    <i class="bi bi-chevron-right text-muted small"></i>
                </a>
                <a href="#" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center py-3 border-0 border-top">
                    <div class="d-flex align-items-center gap-3">
                        <i class="bi bi-shield-lock text-teal fs-5" style="color: #008080;"></i>
                        <span>Keamanan Akun</span>
                    </div>
                    <i class="bi bi-chevron-right text-muted small"></i>
                </a>
            </div>
        </div>

        <!-- Tombol Logout -->
        <div class="px-2 mb-5">
            <button id="btnLogout" class="btn btn-danger w-100 py-3 fw-bold btn-luxury shadow-sm" style="border-radius: 15px; background-color: #dc3545;">
                <i class="bi bi-box-arrow-right me-2"></i> KELUAR AKUN
            </button>
        </div>
        </main>

    <!-- Modal Edit Profil -->
    <div class="modal fade" id="modalEditProfil" tabindex="-1" aria-labelledby="modalEditProfilLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content shadow-lg border-0" style="border-radius: 20px;">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold text-dark" id="modalEditProfilLabel">Edit Profil Saya</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="formUpdateProfil">
                        <div class="mb-3">
                            <label class="form-label small fw-semibold text-muted">Nama Lengkap</label>
                            <input type="text" class="form-control form-control-lg bg-light border-0" id="editNama" required style="border-radius: 12px; font-size: 15px;">
                        </div>
                        <div class="mb-4">
                            <label class="form-label small fw-semibold text-muted">Email</label>
                            <input type="email" class="form-control form-control-lg bg-light border-0" id="editEmail" required style="border-radius: 12px; font-size: 15px;">
                        </div>
                        <button type="submit" class="btn btn-teal w-100 fw-bold py-3" style="background-color: #008080; color: white; border-radius: 15px;">
                            Simpan Perubahan
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- link nav -->
    <nav class="navbar navbar-light bg-white border-top fixed-bottom py-2">
        <div class="container d-flex justify-content-around">
            <a href="beranda.html" class="nav-link text-center text-muted">
                <i class="bi bi-house-door fs-4"></i>
                <small class="d-block" style="font-size: 10px;">Beranda</small>
            </a>
            <a href="jadwal.html" class="nav-link text-center text-muted">
                <i class="bi bi-calendar-event fs-4"></i>
                <small class="d-block" style="font-size: 10px;">Jadwal</small>
            </a>
            <a href="tanya_jawab.html" class="nav-link text-center text-muted">
                <i class="bi bi-chat-dots fs-4"></i>
                <small class="d-block" style="font-size: 10px;">Tanya Jawab</small>
            </a>
            <a href="profil.html" class="nav-link text-center active text-teal">
                <i class="bi bi-person-fill fs-4" style="color: #008080;"></i>
                <small class="d-block" style="font-size: 10px;">Profil</small>
            </a>
        </div>
    </nav>

    <!-- link js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/dist/js/auth.js"></script>
    <script src="/dist/js/ui.js"></script>
    <script src="/dist/js/profil.js"></script>
</body>
</html>
